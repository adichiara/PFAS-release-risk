# Catalog of every dataset the pipeline uses. All sources are publicly available.
#
# status:
#   available  - downloaded automatically by `pfas-risk download`
#   manual     - public, but must be exported by hand from a web portal (see notes)
#   evaluated  - loader written and tested as features; left out because it did not help
#                (`result` gives the cross-validated change). `pfas-risk download` skips it.
#   planned    - public source identified; loader not written yet
#
# MassGIS files are fetched from the public MassGIS download bucket.

massgis_base: https://s3.us-east-1.amazonaws.com/download.massgis.digital.mass.gov

sources:

  # ---- Spatial units -------------------------------------------------------
  block_groups:
    title: 2020 Census block groups (with 2020 population and housing counts)
    publisher: MassGIS / U.S. Census Bureau
    path: shapefiles/census2020/CENSUS2020_BLK_BG_TRCT.zip
    layer: CENSUS2020BLOCKGROUPS_POLY.shp
    role: unit
    status: available

  census_blocks:
    title: 2020 Census blocks (population, housing and land area for the hexagon grid)
    publisher: MassGIS / U.S. Census Bureau
    path: shapefiles/census2020/CENSUS2020_BLK_BG_TRCT.zip
    file: CENSUS2020_BLK_BG_TRCT.zip
    layer: CENSUS2020BLOCKS_POLY.shp
    role: unit
    status: available

  towns:
    title: Municipal boundaries (used for spatially grouped cross-validation)
    publisher: MassGIS
    path: shapefiles/state/towns.zip
    layer: TOWNS_POLY.shp
    role: grouping
    status: available

  # ---- Response ------------------------------------------------------------
  massdep_releases:
    title: MassDEP Waste Site Cleanup notifications and chemicals (bulk download)
    publisher: MassDEP Bureau of Waste Site Cleanup
    url: https://www.mass.gov/doc/downloadable-data-waste-site-cleanup-notifications-status/download
    file: massdep_release_data.zip
    role: response
    status: available
    notes: >
      Zip of RELEASE.DBF, CHEMICAL.DBF and related tables for every RTN (listed on
      https://www.mass.gov/info-details/downloadable-contaminated-site-lists). mass.gov refuses
      plain scripted requests, so `pfas-risk fetch-releases` falls back to a headless browser
      (the `refresh` extra). `pfas-risk releases` then writes
      data/releases/massdep_pfas_releases.csv and massdep_source.json (both committed).

  massdep_site_api:
    title: MassDEP data portal site details (official site coordinates)
    publisher: MassDEP / EEA Data Portal
    url: https://eeaonline.eea.state.ma.us/portal#!/search/wastesite
    role: geocoding
    status: available
    notes: Queried per RTN by `pfas-risk releases` (searchablesite/{RTN}) for Latitude/Longitude.

  address_points:
    title: MassGIS statewide address points (offline geocoding of release addresses)
    publisher: MassGIS
    path: gdbs/MassGIS_AddressPoints.zip
    layer: MAD_ADDRESS_POINTS_GC
    gdb: MassGIS_Statewide_Address_Points.gdb
    role: geocoding
    status: available

  # ---- Candidate PFAS sources and activity -----------------------------------
  fire_stations:
    title: Fire stations (MEMA)
    publisher: MassGIS
    path: shapefiles/state/firestations_pt.zip
    layer: FIRESTATIONS_PT_MEMA.shp
    role: feature
    status: available

  bwp_major:
    title: MassDEP major permitted facilities (air, hazardous waste generators, TSDFs)
    publisher: MassGIS / MassDEP
    path: shapefiles/state/bwpmajor_pt.zip
    layer: BWPMAJOR_PT.shp
    role: feature
    status: available

  ust:
    title: MassDEP underground storage tank facilities
    publisher: MassGIS / MassDEP
    path: shapefiles/state/ust.zip
    layer: BWP_PT_UST.shp
    role: feature
    status: available

  landfills:
    title: MassDEP solid waste land disposal sites (landfill footprints)
    publisher: MassGIS / MassDEP
    path: shapefiles/state/solidwaste.zip
    layer: SW_LD_POLY.shp
    role: feature
    status: available

  major_roads:
    title: 2020 TIGER primary and secondary roads
    publisher: MassGIS / U.S. Census Bureau
    path: shapefiles/census2020/CENSUS2020TIGERROADS_SHP.zip
    layer: CENSUS2020TIGERMAJROADS_ARC.shp
    role: feature
    status: available

  aquifers:
    title: High- and medium-yield aquifers
    publisher: MassGIS / USGS
    path: shapefiles/state/aquifers.zip
    layer: AQUIFERS_POLY.shp
    role: feature
    status: available

  airports:
    title: Airports (FAA NASR), public-use aerodromes and military airfields (AFFF use)
    publisher: FAA Aeronautical Data Delivery Service
    url: https://adds-faa.opendata.arcgis.com/datasets/faa::airports-1
    file: faa_airports_ma.geojson
    fetch:
      kind: arcgis
      service: https://services6.arcgis.com/ssFJjBXIUyZDrSYZ/arcgis/rest/services/US_Airport/FeatureServer/0
      where: STATE='MA'
    role: feature
    status: evaluated
    result: ROC AUC 0.714 -> 0.713, top-10%-land capture 35% -> 34% (4 km² hexagons, smoothed logistic); also no gain in the groundwater model; not used
    notes: >
      The layer does not flag Part 139 certification, so public-use aerodromes (37) and
      military airfields stand in for airports with crash-rescue firefighting.

  military_installations:
    title: Military installations, ranges and training areas (MIRTA)
    publisher: U.S. Department of Defense
    url: https://catalog.data.gov/dataset/military-installations-ranges-and-training-areas
    file: dod_mirta_ma.geojson
    fetch:
      kind: arcgis
      service: https://services2.arcgis.com/FiaPA4ga0iQKduv3/arcgis/rest/services/MIRTA_Polygons_A_view/FeatureServer/0
      where: STATENAMECODE='MA'
    role: feature
    status: evaluated
    result: ROC AUC 0.714 -> 0.707, capture 35% -> 32% (4 km² hexagons, smoothed logistic); also no gain in the groundwater model; not used

  epa_tri:
    title: EPA Toxics Release Inventory reporters, Massachusetts, 2014-2024
    publisher: U.S. EPA
    url: https://www.epa.gov/toxics-release-inventory-tri-program/tri-basic-data-files-calendar-years-1987-present
    file: epa_tri_ma.csv
    fetch:
      kind: tri
      url: https://data.epa.gov/efservice/downloads/tri/mv_tri_basic_download/{year}_MA/csv
      first_year: 2014
      last_year: 2024
    role: feature
    status: evaluated
    result: ROC AUC 0.714 -> 0.706, capture 35% -> 32% (4 km² hexagons, smoothed logistic); also no gain in the groundwater model; not used
    notes: No Massachusetts facility reported a PFAS chemical in these years, so all reporters are used.

  pws_sources:
    title: Public water supply sources (wells and intakes)
    publisher: MassGIS / MassDEP
    path: shapefiles/state/pwsdep_pt.zip
    layer: PWSDEP_PT.shp
    role: feature
    status: available

  massdep_dw_pfas:
    title: PFAS6 results for public water systems (MassDEP drinking-water data)
    publisher: MassDEP / EEA Data Portal
    url: https://eeaonline.eea.state.ma.us/portal#!/search/drinking-water
    file: massdep_dw_pfas6.csv
    fetch:
      kind: eea_drinking_water
      url: https://eeaonline.eea.state.ma.us/EEA/DataLake/V1.0/DataLakeAPI/drinkingWater
      chemical: PFAS6
      systems_from: pws_sources
      skip_types: [TNC]
    role: feature
    status: available
    notes: >
      Only samples collected before the forward-test cutoff (2023-01-01) are used, so the
      forward test stays honest. Transient systems (not required to test) are skipped.

  sewer_service:
    title: Sewer service areas of municipal wastewater treatment plants
    publisher: MassGIS / MassDEP
    path: shapefiles/state/DEP_Sewer_Service_Areas.zip
    layer: SEWER_SERVICE_AREA_POTW_POLY.shp
    role: feature
    status: available
    notes: >
      Used by the groundwater model (sewered or on septic systems). Tested as a release-model
      feature and left out there (ROC AUC 0.714 -> 0.722, capture 35% -> 30%).

  epa_frs:
    title: EPA Facility Registry Service, Massachusetts facilities and NAICS codes
    publisher: U.S. EPA
    download_url: https://ordsext.epa.gov/FLA/www3/state_files/state_combined_ma.zip
    url: https://www.epa.gov/frs/epa-state-combined-csv-download-files
    file: frs_state_combined_ma.zip
    role: feature
    status: available
    notes: >
      Facilities in the PFAS-related sectors of config/pfas_sectors.yaml (by NAICS prefix)
      become point features. Public replacement for the non-public BAW industry list used in 2021.

  # ---- Who lives in higher-risk areas (context, not model features) -----------
  ej_populations:
    title: 2020 Environmental Justice populations (block groups; minority, income, limited-English criteria)
    publisher: MassGIS / Executive Office of Energy and Environmental Affairs
    path: shapefiles/census2020/ej2020.zip
    layer: EJ_POLY.shp
    role: context
    status: available

  sdwis_sellers:
    title: Purchased-water links between public water systems (who buys from whom)
    publisher: U.S. EPA Safe Drinking Water Information System (Envirofacts)
    url: https://www.epa.gov/enviro/sdwis-overview
    file: sdwis_sellers_ma.csv
    fetch:
      kind: envirofacts
      url: https://data.epa.gov/efservice/WATER_SYSTEM_FACILITY/PRIMACY_AGENCY_CODE/=/MA/SELLER_PWSID/!=/null
    role: context
    status: available
    notes: Systems that buy their water (MWRA members, for example) take their sellers' PFAS results.

  ucmr5:
    title: EPA UCMR 5 PFAS results for public water systems, 2023-2025 (29 PFAS)
    publisher: U.S. EPA
    url: https://www.epa.gov/dwucmr/occurrence-data-unregulated-contaminant-monitoring-rule
    download_url: https://www.epa.gov/system/files/other-files/2023-08/ucmr5-occurrence-data.zip
    file: ucmr5-occurrence-data.zip
    role: context
    status: available
    notes: Federal cross-check on the state PFAS6 results; the six PFAS6 compounds are summed per sample.

  water_service_areas:
    title: Community public water system service areas (outside them, homes are presumed on private wells)
    publisher: MassGIS / MassDEP
    path: shapefiles/state/DEP_PWS_Water_Service_Areas.zip
    layer: PWS_WATER_SERVICE_AREA_COMM_POLY.shp
    role: context
    status: available

  # ---- Identified, not yet wired in -----------------------------------------
  land_cover_2016:
    title: 2016 land cover / land use (industrial, commercial, impervious fractions)
    publisher: MassGIS
    path: shapefiles/lclu2016/
    role: feature
    status: planned
    notes: 294 tiles, ~5.4 GB. Optional heavy step.

