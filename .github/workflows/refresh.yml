name: Refresh data and model

# Weekly: download MassDEP's release data; if it changed, rebuild the PFAS release list,
# rerun the model, commit the results to main and redeploy the Pages site.
on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if MassDEP's data has not changed
        type: boolean
        default: false

permissions:
  contents: write   # commit refreshed results to main
  actions: write    # start the Pages deploy (pushes made with GITHUB_TOKEN don't trigger workflows)

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # four units, plus ~20 min of drinking-water downloads on a new cache key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -e ".[refresh]"
          python -m playwright install --with-deps chromium

      - name: Download MassDEP release data
        id: fetch
        run: pfas-risk -v fetch-releases | tee fetch.log && grep '^changed=' fetch.log >> "$GITHUB_OUTPUT"

      - name: Restore cached public layers
        if: steps.fetch.outputs.changed == 'true' || inputs.force
        uses: actions/cache@v4
        with:
          # MassGIS layers change rarely; the MassDEP and EPA files are re-downloaded every run
          # and the feature table is rebuilt from them.
          path: |
            data/raw
            !data/raw/massdep_release_data.zip
            !data/raw/frs_state_combined_ma.zip
            data/interim/address_index.parquet
          key: layers-${{ hashFiles('config/sources.yaml', 'src/pfas_risk/geocode.py') }}

      - name: Rebuild release list and model
        if: steps.fetch.outputs.changed == 'true' || inputs.force
        run: |
          pfas-risk -v download
          pfas-risk -v releases
          pfas-risk -v exposure   # drinking water: public systems and private wells (front page)
          # Every unit with a committed evaluation is rerun, since the site compares them all;
          # 1 km² hexagons (the primary unit) go last so their run writes the final site.
          for unit in "--unit bg" "--unit hex --cell-km2 4" "--unit hex --cell-km2 2" "--unit hex --cell-km2 1"; do
            pfas-risk $unit -v features --force
            pfas-risk $unit -v run
          done

      - name: Commit results
        id: commit
        if: steps.fetch.outputs.changed == 'true' || inputs.force
        run: |
          git add data/releases outputs docs
          if git diff --cached --quiet; then
            echo "Nothing changed"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh PFAS release list and model ($(jq -r .tables_dated data/releases/massdep_source.json) MassDEP data)"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
