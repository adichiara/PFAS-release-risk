[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfas-release-risk"
version = "0.1.0"
description = "Block-group PFAS release risk model for Massachusetts, built on public data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "pyarrow>=14",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
pfas-risk = "pfas_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
pfas_risk = ["*.html"]
